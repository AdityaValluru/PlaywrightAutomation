# =============================================================================
# Application Configuration — config.properties
# =============================================================================
# Override any property at runtime via Maven -D flags, e.g.:
#   mvn test -Dbrowser=firefox -Dheadless=true

# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------
# dev | staging | prod
environment=dev

# Base URL of the application under test
base.url=http://localhost:5173/login

# URL fragment expected in the address bar after a successful login
post.login.url.fragment=/

# -----------------------------------------------------------------------------
# Browser Configuration
# -----------------------------------------------------------------------------
# chromium | firefox | webkit
browser=chromium

# Run the browser in headless mode: true | false
headless=false

# Slow-motion delay between Playwright actions (ms). Set to 0 to disable.
slowmo=0

# Viewport dimensions
viewport.width=1920
viewport.height=1080

# -----------------------------------------------------------------------------
# Timeouts (milliseconds)
# -----------------------------------------------------------------------------
explicit.wait.ms=30000
navigation.timeout.ms=60000

# -----------------------------------------------------------------------------
# Report Configuration
# -----------------------------------------------------------------------------
report.name=Playwright UI Automation Report
report.title=UI Automation Report
report.author=Automation Team

# -----------------------------------------------------------------------------
# Test Data
# -----------------------------------------------------------------------------
search.term=test
home.page.title=UI Automation

# -----------------------------------------------------------------------------
# Validation / Error Messages
# (Update these to match the exact wording used by your application)
# -----------------------------------------------------------------------------
login.error.message=Invalid credentials
username.required.message=admin
password.required.message=Admin@123

# -----------------------------------------------------------------------------
# Trace Configuration
# -----------------------------------------------------------------------------
# Enable Playwright tracing: true | false
trace.enabled=true

# Retain trace only on failure: true | false
trace.retain.on.failure=true
