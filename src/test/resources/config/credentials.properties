# =============================================================================
# Credential Configuration — credentials.properties
# =============================================================================
# IMPORTANT SECURITY NOTICE:
#   - Do NOT commit real credentials to source control.
#   - In CI/CD pipelines, inject these values as masked environment variables
#     (e.g. -Dvalid.username=$USERNAME) or use a secrets manager.
#   - The values below are placeholders for local development only.

# -----------------------------------------------------------------------------
# Valid user credentials (positive test cases)
# -----------------------------------------------------------------------------
valid.username=admin
valid.password=Admin@123

# -----------------------------------------------------------------------------
# Admin user credentials
# -----------------------------------------------------------------------------
admin.username=admin@example.com
admin.password=Admin@Password123

# -----------------------------------------------------------------------------
# Invalid credentials (negative / error-path test cases)
# -----------------------------------------------------------------------------
invalid.username=invalid_user@example.com
invalid.password=WrongPass999
